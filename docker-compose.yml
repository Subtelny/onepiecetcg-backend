services:
  postgres:
    image: postgres:16-alpine
    container_name: onepiecetcg-postgres
    environment:
      POSTGRES_DB: optcg
      POSTGRES_USER: optcg
      POSTGRES_PASSWORD: optcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  