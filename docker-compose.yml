services:
  postgres:
    image: postgres:16-alpine
    container_name: onepiecetcg-postgres
    environment:
      POSTGRES_DB: onepiecetcg
      POSTGRES_USER: onepiecetcg
      POSTGRES_PASSWORD: onepiecetcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
