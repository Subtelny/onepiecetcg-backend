server:
  port: 3000

spring:
  application:
    name: onepiecetcg-backend

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    pl.janda.onepiecetcg: DEBUG
    org.springframework.web: INFO
