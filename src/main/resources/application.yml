server:
  port: 8080

# Local development configuration. For Railway/production, use prod profile.
spring:
  application:
    name: onepiecetcg-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:optcg}
    username: ${DB_USERNAME:optcg}
    password: ${DB_PASSWORD:optcg}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: false

# Comma-separated. Only browser calls need this - the frontend's SSR server renders
# from Node, which sends no Origin header and so never triggers CORS. The browser then
# hydrates and takes over fetching, which does. 5173 is the frontend dev server, 4173
# the built SSR server.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:4173}

onepiece-cardgame:
  errata-url: https://en.onepiece-cardgame.com/rules/errata_card/
  topics-url: https://en.onepiece-cardgame.com/topics/
  faq-url: https://en.onepiece-cardgame.com/rules/faq/

card-sets:
  sync:
    cron: "0 0 3 * * *"

set-cards:
  sync:
    cron: "0 15 3 * * *"

card-errata:
  sync:
    cron: "0 30 3 * * *"

card-faq:
  sync:
    cron: "0 45 3 * * *"

cardmarket:
  product-catalog-url: https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json
  price-guide-url: https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json
  sync:
    cron: "0 0 4 * * *"

internal:
  api-key: ${INTERNAL_API_KEY:dev-only-change-me}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    pl.janda.onepiecetcg: DEBUG
    org.springframework.web: INFO
