server:
  port: 3000

spring:
  application:
    name: onepiecetcg-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/onepiecetcg
    username: ${DB_USERNAME:onepiecetcg}
    password: ${DB_PASSWORD:onepiecetcg}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

# Comma-separated. Only browser calls need this - the frontend's SSR server renders
# from Node, which sends no Origin header and so never triggers CORS. The browser then
# hydrates and takes over fetching, which does. 5173 is the frontend dev server, 4173
# the built SSR server.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

optcgapi:
  base-url: https://www.optcgapi.com/api

onepiece-cardgame:
  errata-url: https://en.onepiece-cardgame.com/rules/errata_card/
  topics-url: https://en.onepiece-cardgame.com/topics/
  faq-url: https://en.onepiece-cardgame.com/rules/faq/

card-sets:
  sync:
    cron: "0 0 3 * * *"

set-cards:
  sync:
    cron: "0 15 3 * * *"

card-errata:
  sync:
    cron: "0 30 3 * * *"

card-faq:
  sync:
    cron: "0 45 3 * * *"

internal:
  api-key: ${INTERNAL_API_KEY:dev-only-change-me}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    pl.janda.onepiecetcg: DEBUG
    org.springframework.web: INFO
