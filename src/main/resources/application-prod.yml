server:
  port: ${PORT:3000}
  address: 0.0.0.0
  tomcat:
    threads:
      max: 20
      min-spare: 2

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  task:
    execution:
      pool:
        core-size: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    pl.janda.onepiecetcg: INFO
    org.springframework.web: WARN
