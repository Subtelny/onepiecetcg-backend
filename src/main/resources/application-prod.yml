spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      # Stays on 'update': with no migration tool in the project, this is what creates and evolves the
      # JPA-mapped schema on deploy. 'validate' would turn every entity change into a boot failure
      # until someone had applied the DDL by hand. The one thing ddl-auto cannot express - the
      # generated card_semantic_search_vector column - is applied at startup by
      # SetCardSearchVectorSchemaInitializer instead. See DEPLOYMENT.md.
      ddl-auto: update
    show-sql: false

# Off in prod: the spec is an unauthenticated, machine-readable map of every route, including
# /api/internal/* - which is protected only by a shared API key, so advertising it is pure
# attacker convenience. Both flags are set because swagger-ui serves nothing without api-docs,
# but leaving api-docs on would keep the raw spec reachable. Use the local profile's Swagger UI
# when you need to inspect a contract.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    pl.janda.onepiecetcg: INFO
    org.springframework.web: WARN
